name: daily-shorts

# George Edos: 5 tutorial Shorts a day (Claude / ChatGPT+Codex / Grok), 35 a week. Free public-repo runners.
# prepare (write + voice + register, commits episodes) -> render (one runner per Short) -> publish (Studio, private + publishAt).
# Slots 13/16/19/22/01 UTC = 8 AM / 11 AM / 2 PM / 5 PM / 8 PM ET. Manual run: gh workflow run daily.yml [-f n=5]

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      n:
        description: "how many Shorts"
        default: "5"
      publish:
        description: "schedule on YouTube (false = render only, for review)"
        default: "true"

permissions:
  contents: write

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      batch: ${{ steps.p.outputs.batch }}
      sha: ${{ steps.p.outputs.sha }}
      count: ${{ steps.p.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: tools/requirements.txt }
      - name: ffmpeg + whisper
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -r tools/requirements.txt
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: whisper-base-en }
      - id: p
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVEN_PAID_KEY: ${{ secrets.ELEVEN_PAID_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/daily.py prepare --n "${{ inputs.n || '5' }}"
          for ep in $(python -c "import json;print(' '.join(x['ep'] for x in json.load(open('out_batch.json'))))"); do
            tar -czf /tmp/vo-$ep.tgz -C public/$ep vo
            gh release create "vo-$ep" --title "vo $ep" --notes "narration" --prerelease /tmp/vo-$ep.tgz
          done
          git config user.name "george-edos-bot" && git config user.email "actions@users.noreply.github.com"
          git add episodes src/Root.tsx tools/state.json
          git commit -qm "daily: $(python -c "import json;print(' '.join(x['ep'] for x in json.load(open('out_batch.json'))))")"
          git push -q
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "count=$(python -c "import json;print(len(json.load(open('out_batch.json'))))")" >> "$GITHUB_OUTPUT"
          echo "batch=$(python -c "import json;print(json.dumps({'include': json.load(open('out_batch.json'))}))")" >> "$GITHUB_OUTPUT"

  render:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.batch) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.prepare.outputs.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }
      - name: Browser deps + ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 >/dev/null
      - name: Narration
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download "vo-${{ matrix.ep }}" -p "*.tgz" -D /tmp/vo
          mkdir -p public/${{ matrix.ep }} && tar -xzf /tmp/vo/*.tgz -C public/${{ matrix.ep }}
      - run: npm ci --silent
      - uses: actions/cache@v4
        with: { path: node_modules/.remotion, key: "remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}" }
      - name: Render + master + QA
        run: |
          EP=${{ matrix.ep }}; COMP=$(echo $EP | tr a-z A-Z)
          mkdir -p out
          npx remotion render $COMP out/${EP}_raw.mp4 --concurrency=4 --log=error
          python3 tools/master.py out/${EP}_raw.mp4 out/${EP}.mp4
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out/${EP}.mp4)
          echo "duration $D"
          python3 -c "import sys; d=float('$D'); sys.exit(0 if 20 <= d <= 59.5 else 'QA: duration %.1f s outside 20-59.5' % d)"
          python3 -c "import subprocess,sys; r=subprocess.run(['ffmpeg','-i','out/$EP.mp4','-af','volumedetect','-f','null','-'],capture_output=True,text=True).stderr; m=[l for l in r.splitlines() if 'mean_volume' in l]; print(m); sys.exit(0 if m and float(m[0].split(':')[1].split()[0]) > -40 else 'QA: silent audio')"
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.ep }}", path: "out/${{ matrix.ep }}.mp4", retention-days: 7 }
      - name: Publish (private + publishAt)
        if: inputs.publish != 'false'
        env:
          SCHED_EMAIL: ${{ secrets.SCHED_EMAIL }}
          SCHED_PASSWORD: ${{ secrets.SCHED_PASSWORD }}
        run: python3 tools/daily.py publish ${{ matrix.ep }} ${{ matrix.slot }}
